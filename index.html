<style>
html,body{margin:0;height:100%;background:#174A2B;overflow:hidden}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#stage{width:960px;height:540px;flex:none;transform-origin:center center}

body{margin:0}
button{font-family:inherit;cursor:pointer}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(7px)}}
@keyframes bar{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.up{animation:up .7s cubic-bezier(.2,.8,.2,1) both}
.bob{animation:bob 3.2s ease-in-out infinite}
.ly{position:absolute;top:0;transition:transform 1s cubic-bezier(.55,0,.2,1)}
.st{opacity:.45;transition:opacity .7s ease}

.r[data-i="0"] .s0{opacity:1}.r[data-i="0"] .s0 .pp{transform:scale(1);opacity:1}.r[data-i="1"] .s1{opacity:1}.r[data-i="1"] .s1 .pp{transform:scale(1);opacity:1}.r[data-i="2"] .s2{opacity:1}.r[data-i="2"] .s2 .pp{transform:scale(1);opacity:1}.r[data-i="3"] .s3{opacity:1}.r[data-i="3"] .s3 .pp{transform:scale(1);opacity:1}.r[data-i="4"] .s4{opacity:1}.r[data-i="4"] .s4 .pp{transform:scale(1);opacity:1}.r[data-i="5"] .s5,.r[data-i="6"] .s5{opacity:1}.r[data-i="5"] .s5 .pp,.r[data-i="6"] .s5 .pp{transform:scale(1);opacity:1}
.arw{position:absolute;top:304px;width:46px;height:46px;border-radius:50%;border:2.5px solid #fff;background:#174A2B;color:#FFE08A;font-size:24px;font-weight:800;padding:0;display:flex;align-items:center;justify-content:center;z-index:30;box-shadow:0 0 0 5px rgba(255,255,255,.35),0 6px 14px rgba(0,0,0,.3);transition:transform .25s ease,background-color .25s ease,color .25s ease}
.arw:hover{transform:scale(1.1);background:#F0B53F;color:#174A2B}
.arw:focus-visible,.au:focus-visible,.dt:focus-visible{outline:3px solid #174A2B;outline-offset:3px}
.arw[data-off="yes"]{opacity:.25;cursor:default;transform:none;pointer-events:none}
.arw[data-pulse="yes"] span{display:block;animation:nudge 1.1s ease-in-out infinite}
.dt{width:10px;height:10px;border-radius:50%;border:0;padding:0;background:rgba(23,74,43,.3);transition:all .3s ease}
.dt[data-on="yes"]{background:#F0B53F;width:26px;border-radius:5px}
.au{width:46px;height:46px;border-radius:50%;background:#8A5A12;border:3px solid #F0B53F;display:flex;align-items:center;justify-content:center;gap:2px;padding:0;box-sizing:border-box}
.au i{display:block;width:3px;height:6px;background:#F0B53F;border-radius:2px}
.au[data-play="yes"]{background:#174A2B}
.au[data-play="yes"] i{animation:bar .8s ease-in-out infinite;height:18px}
.au[data-play="yes"] i:nth-child(2){animation-delay:.15s}.au[data-play="yes"] i:nth-child(3){animation-delay:.3s}
.br{opacity:0;transition:opacity .6s ease}.r[data-i="0"] .b0{opacity:1}.r[data-i="1"] .b1{opacity:1}.r[data-i="2"] .b2{opacity:1}.r[data-i="3"] .b3{opacity:1}.r[data-i="4"] .b4{opacity:1}.r[data-i="5"] .b5{opacity:1}.r[data-i="6"] .b6{opacity:1}
.gl{transition:opacity .4s ease,left .4s ease,top .4s ease,width .4s ease}.glb{transition:width .4s ease,height .4s ease}.r[data-i="5"] .gl{left:100px!important;top:86px!important;width:760px!important;height:124px!important}.r[data-i="5"] .glb{width:760px!important;height:112px!important}.r[data-i="5"] .gi{gap:10px!important;padding:0 48px!important}.r[data-i="6"] .gl{opacity:0}
.bb{position:absolute;left:0;top:0;width:100%;height:100%;transition:opacity .5s ease,transform .6s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion: reduce){.up,.bob,.arw[data-pulse="yes"] span,.au[data-play="yes"] i{animation:none}.ly,.st,.pp,.bb,.br{transition:none}}

</style></head><body>

<script>
const T=['El punto de partida', 'Conoce a las personas', 'Define roles y expectativas claras', 'Fomenta la comunicación abierta', 'Reconoce y celebra logros diarios', 'Construye un ambiente de confianza y aprendizaje'];
const P=[
      'Un equipo fuerte se construye con confianza, comunicación y objetivos compartidos.',
      'No lideras cargos, lideras personas.',
      'Cuando todos entienden su rol, existe más organización, confianza y trabajo en equipo.',
      'Los equipos fuertes no solo ejecutan; también participan y proponen.',
      'Un agradecimiento o una felicitación a tiempo puede generar grandes cambios.',
      'Los errores pueden convertirse en oportunidades de crecimiento cuando existe apoyo y confianza.'
    ];
const BUB="<div class=\"bb\" style=\"opacity: 0; transform: translateY(10px)\">\n<div class=\"gi\" style=\"position:absolute; left:0; top:0; right:0; bottom:0; padding:0 36px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:4px\"><div style=\"font-weight:800; font-size:23px; line-height:1.15; color:#FFE08A\" class=\"bk\"></div><div style=\"font-family:Montserrat,sans-serif; font-weight:500; font-size:15px; line-height:1.25; text-wrap:balance; color:#fff\" class=\"bp\"></div></div>\n</div>";
const r=document.getElementById('r');
const bubs=document.getElementById('bubs');
bubs.style.display='contents';
const bbEls=T.map((t,k)=>{const d=document.createElement('div');d.innerHTML=BUB;const e=d.firstElementChild;e.querySelector('.bk').textContent=t;e.querySelector('.bp').textContent=P[k];bubs.appendChild(e);return e});
const dotsw=document.getElementById('dotsw');
let i=0;
const dotEls=[0,1,2,3,4,5,6].map(k=>{const b=document.createElement('button');b.className='dt';b.setAttribute('aria-label',k===0?'Ir al inicio':k===6?'Ir a la conclusión':'Ir al paso '+k);b.onclick=()=>go(k);dotsw.appendChild(b);return b});
const l0=document.getElementById('l0'),l1=document.getElementById('l1'),l2=document.getElementById('l2');
const fin=document.getElementById('fin'),finc=document.getElementById('finc');
const bp=document.getElementById('bp'),bn=document.getElementById('bn');
function render(){
  const j=Math.min(i,5);
  r.dataset.i=i;
  l0.style.transform='translateX('+(-j*56+(i>=5?34:0))+'px)';
  l1.style.transform='translateX('+(-j*560)+'px)';
  l2.style.transform='translateX('+(-j*728)+'px)';
  bbEls.forEach((e,k)=>{e.style.opacity=k===i?1:0;e.style.transform='translateY('+(k===i?0:10)+'px)'});
  dotEls.forEach((d,k)=>d.dataset.on=k===i?'yes':'no');
  fin.style.opacity=i===6?1:0;finc.style.transform='translateY('+(i===6?0:14)+'px)';
  bp.dataset.off=i===0?'yes':'no';bn.dataset.off=i===6?'yes':'no';bn.dataset.pulse=i===0?'yes':'no';
}
function go(k){i=Math.max(0,Math.min(6,k));render()}
bp.onclick=()=>go(i-1);bn.onclick=()=>go(i+1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(i+1);if(e.key==='ArrowLeft')go(i-1)});
const stage=document.getElementById('stage');
function fit(){const k=Math.min(innerWidth/960,innerHeight/540);stage.style.transform='scale('+k+')'}
addEventListener('resize',fit);fit();render();
</script></body></html>
